<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

```
<div class="music-player">
    <h1>🎵 Music Player</h1>

    <div class="album-cover">🎧</div>

    <h2 id="title">Kesariya</h2>
    <p id="artist">Arijit Singh</p>

    <audio id="audio" controls>
        <source src="./Kesariya.mp3" type="audio/mpeg">
    </audio>

    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <input type="range" id="progress" value="0" min="0" max="100">

    <div class="controls">
        <button onclick="previousSong()">⏮</button>
        <button id="playBtn" onclick="playPause()">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <div class="volume-control">
        <label for="volume">🔊 Volume</label>
        <input type="range" id="volume" min="0" max="1"
               step="0.1" value="1">
    </div>

    <p class="footer">Enjoy Your Music ✨</p>
</div>

<script src="script.js"></script>
```

</body>
</html>
