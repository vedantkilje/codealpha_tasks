<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

```
<header>
    <h1>My Image Gallery</h1>
    <p>Explore beautiful moments</p>
</header>

<div class="filters">
    <button class="active" onclick="filterImages('all', this)">All</button>
    <button onclick="filterImages('nature', this)">Nature</button>
    <button onclick="filterImages('animals', this)">Animals</button>
    <button onclick="filterImages('cities', this)">Cities</button>
</div>

<div class="gallery">

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful nature">
        <p>Nature</p>
    </div>

    <div class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600" alt="Cute dog">
        <p>Animals</p>
    </div>

    <div class="gallery-item" data-category="cities">
        <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600" alt="City skyline">
        <p>Cities</p>
    </div>

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Mountain lake">
        <p>Mountains</p>
    </div>

    <div class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600" alt="Golden retriever">
        <p>Golden Retriever</p>
    </div>

    <div class="gallery-item" data-category="cities">
        <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600" alt="City architecture">
        <p>Architecture</p>
    </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <button class="close" onclick="closeLightbox()" aria-label="Close">×</button>
    <button class="prev" onclick="changeImage(-1)" aria-label="Previous image">❮</button>
    <img id="lightboxImage" src="" alt="Selected gallery image">
    <button class="next" onclick="changeImage(1)" aria-label="Next image">❯</button>
</div>

<footer>
    <p>© 2026 My Image Gallery</p>
</footer>

<script src="script.js"></script>
```

</body>
</html>
